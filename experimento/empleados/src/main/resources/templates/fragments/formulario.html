<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="icon" th:href="@{/img/dragon.jpg}">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script th:src="@{/js/bootstrap.min.js}"></script>
</head>
<body class="d-flex align-items-center" style="height: 100vh;">
<div class="container" th:fragment="formulario">
    <div class="row justify-content-center w-100">
        <div class="col-12">
            <form class="row g-3 needs-validation form" novalidate th:action="@{/empleados/guardar}" th:object="${empleado}" method="get">
                <div class="col-md-4">
                    <label for="validationServer01" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="validationServer01" value="Meow" required th:field="*{empleado.nombre}">
                    <div class="invalid-feedback">
                        Indica el nombre
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="validationServer02" class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="validationServer02" value="Otto" required>
                    <div class="invalid-feedback">
                        Indica apellidos
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="validationServerUsername" class="form-label">DNI</label>
                    <input type="text" class="form-control" id="validationServerUsername" value="Otto" required>
                    <div class="invalid-feedback">
                        Indica apellidos
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="validationServer03" class="form-label">City</label>
                    <input type="text" class="form-control" id="validationServer03" aria-describedby="validationServer03Feedback" required>
                    <div id="validationServer03Feedback" class="invalid-feedback">
                        Indica tu última titulacion.
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="validationServer04" class="form-label">Puesto</label>
                    <select class="form-select" id="validationServer04" aria-describedby="validationServer04Feedback" required>
                        <option selected disabled value="">Puestos...</option>
                        <option>...</option>
                    </select>
                    <div id="validationServer04Feedback" class="invalid-feedback">
                        Indica el puesto.
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="validationServer05" class="form-label">Nº Hijos</label>
                    <input type="text" class="form-control" id="validationServer05" aria-describedby="validationServer05Feedback" required>
                    <div id="validationServer05Feedback" class="invalid-feedback">
                        Indica el numero de hijos.
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="invalidCheck3" aria-describedby="invalidCheck3Feedback" required>
                        <label class="form-check-label" for="invalidCheck3">
                            Estoy de acuerdo con los términos y condiciones.
                        </label>
                        <div id="invalidCheck3Feedback" class="invalid-feedback">
                            Debes estar de acuerdo con los términos y condiciones.
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Dar de Alta</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
